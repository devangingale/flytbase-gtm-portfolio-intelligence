services:
  - type: web
    name: flytbase-gtm-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/main.py
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: MCP_TOKEN
        sync: false
      - key: MCP_ENDPOINT
        value: https://flytbase-gtm-hackathon.lovable.app/api/mcp
      - key: NIM_API_KEY
        sync: false
      - key: NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NIM_EXTRACTION_MODEL
        value: nvidia/llama-3.3-nemotron-super-49b-v1
      - key: NIM_SYNTHESIS_MODEL
        value: nvidia/llama-3.3-nemotron-super-49b-v1
      - key: SYNC_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SYNC_INTERVAL_SECONDS
        value: "300"
